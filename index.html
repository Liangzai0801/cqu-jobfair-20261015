const propertyLine=[x.parent,x.stock_code].filter(Boolean).map(esc).join(' · ');
const evidence=x.sources.length?`<details class="evidence"><summary>企业性质与上市关系依据（${x.sources.length}）</summary><p>${esc(x.detail)}</p><ul>${x.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('')}</ul></details>`:'';
return `<article class="card ${x.status}"><div class="top"><span class="code">${esc(x.booth)}</span><span>${esc(x.region)}</span><span class="badge ${x.status==='ask'?'ask':''}">${x.status==='main'?'有2027招聘线索':'现场待问'}</span>${x.new?'<span class="badge new">本次新增</span>':''}</div><h2>${esc(x.company)}</h2><div class="tags">${tags.join('')}</div>${propertyLine?`<div class="enterprise-line">${propertyLine}</div>`:''}<div class="label">岗位 / 方向</div><div class="content">${md(x.jobs)}</div><div class="label">工作地证据</div><div class="content">${md(x.location)}</div><div class="note">${md(x.note)}</div>${evidence}</article>`}).join('')||'<p class="empty">没有匹配的单位，请调整地区、企业性质或关键词。</p>';
}
qs.oninput=render;status.onchange=render;kind.onchange=render;render();
</script>
</body>
</html>
